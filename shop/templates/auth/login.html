{% extends "base.html" %}
{% block title %}Log in · Online Shop{% endblock %}
{% block content %}
<section class="form-card narrow">
  <h1>Log in</h1>
  <p class="muted">Use the email and password from your registration.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ email }}" autocomplete="off">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password">
    </label>
    <button class="btn btn-big btn-wide" type="submit">Log in</button>
  </form>
  <p class="muted small-gap">No account yet? <a href="{{ url_for('customer.register', next=request.args.get('next')) }}">Register</a></p>
</section>
{% endblock %}
